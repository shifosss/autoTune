[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autotune"
version = "0.1.0"
description = "Autonomous finetuning framework with DAG-structured checkpoint management and manifold-based hyperparameter navigation"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "numpy>=1.24",
    "optuna>=4.0",
    "aiohttp>=3.9",
    "watchdog>=3.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
safetensors = ["safetensors>=0.4"]
peft = ["peft>=0.7"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
autotune = "autotune.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autotune"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
